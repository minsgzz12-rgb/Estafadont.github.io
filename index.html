@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1624;--card:#193B50;--tx:#EAF4F1;--mu:#a9c1c9;--bd:#2c5167;--ok:#A5E6CD;--bad:#ff8f84;--warn:#f3c26b}}
:root[data-theme="dark"]{--bg:#0b1624;--card:#193B50;--tx:#EAF4F1;--mu:#a9c1c9;--bd:#2c5167;--ok:#A5E6CD;--bad:#ff8f84;--warn:#f3c26b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{font-weight:800;font-size:19px;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}.logo i{font-style:normal;background:var(--mint);color:var(--navy);border-radius:8px;padding:2px 6px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{color:#cfe2db;text-decoration:none;padding:7px 11px;border-radius:999px;white-space:nowrap;font-size:14px}nav a.on{background:var(--mint);color:var(--navy);font-weight:700}
.acc{background:transparent;color:#fff;border:1.5px solid var(--mint);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:18px 14px 50px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 10px}h2{font-size:24px;margin:26px 0 10px}h3{margin:0 0 6px;font-size:18px}p{margin:0 0 10px}.mu{color:var(--mu)}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:20px;padding:30px 22px;display:grid;gap:16px;grid-template-columns:1fr auto;align-items:center}
.hero .big{font-size:84px;line-height:1}.hero p{color:#d7e8e2;max-width:52ch}
.btn{background:var(--mint);color:var(--navy);border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}.btn.s{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}.card .ic{font-size:30px}
.tool{cursor:pointer;transition:transform .15s}.tool:hover{transform:translateY(-3px)}
.tag{display:inline-block;background:var(--mint);color:var(--navy);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}.tabs button.on{background:var(--mint);color:var(--navy);border-color:var(--mint);font-weight:700}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:14px;font-weight:600}
.res{border-left:5px solid var(--ok);background:var(--card);border-radius:10px;padding:12px 14px;margin-top:12px}.res.bad{border-color:var(--bad)}.res.warn{border-color:var(--warn)}
.fact{min-height:170px;display:flex;gap:16px;align-items:center;background:var(--navy);color:#fff;border-radius:18px;padding:22px}.fact .ic{font-size:58px}.fact p{color:#d7e8e2;margin:0}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px;align-items:center}.dots b{width:9px;height:9px;border-radius:50%;background:var(--bd);cursor:pointer}.dots b.on{background:var(--ok);width:22px;border-radius:6px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--mint)}
.badge{text-align:center;padding:12px 6px}.badge.off{opacity:.35;filter:grayscale(1)}.badge .ic{font-size:34px}.badge small{display:block;color:var(--mu)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:700}
.mo{position:fixed;inset:0;background:rgba(10,20,34,.7);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}.mo[hidden]{display:none}.mo .card{max-width:400px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--mint);padding:10px 18px;border-radius:999px;z-index:50;display:none;border:1px solid var(--mint)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
@media(max-width:600px){.hero{grid-template-columns:1fr}.hero .big{font-size:56px}.fact{flex-direction:column;text-align:center}}
nav{min-width:0}.sq{width:112px;margin:0;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;border:1.5px solid var(--mint);font-size:14px}.sq::placeholder{color:#cfe2db}
.hero2{background:linear-gradient(160deg,var(--navy),var(--blue));color:#fff;border-radius:22px;padding:28px 18px 30px;text-align:center}.hero2 p{color:#d7e8e2;max-width:48ch;margin:6px auto 16px;font-size:18px}
.big-t{font-size:clamp(32px,10vw,86px);font-weight:300;letter-spacing:.14em;margin:0;line-height:1.05}
.pc{position:relative;padding-bottom:70px}.pc .ics{font-size:38px;letter-spacing:6px;margin-top:6px}.circ{position:absolute;right:12px;bottom:12px;width:50px;height:50px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:25px;background:var(--bg)}
.cta{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:16px;padding:16px 18px;margin-top:14px;font-size:18px}
.obj{display:flex;gap:16px;align-items:center;margin-bottom:12px}.vsh{display:block;width:230px;max-width:70%;margin:6px auto 18px}
@media(max-width:600px){.sq{width:84px}}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
</style></head><body>
<header><div class="logo" onclick="location.hash='inicio'"><i>🛡️</i>Estafad’ont</div><nav id="nav"></nav><input id="q" class="sq" placeholder="🔍 Buscar" aria-label="Buscar en la plataforma" onkeydown="if(event.key==='Enter')srch(this.value)"><button class="acc" id="accb" onclick="accClick()">👤 Entrar</button></header>
<main id="m"></main><div class="mo" id="md" hidden></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={user:null,acts:[],reps:[],favs:[],pts:0,badges:[],al:true,hide:false};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('edt')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('edt',JSON.stringify(S))}catch(e){}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};
const NAV=[['inicio','🏠','Inicio'],['problema','⚠️','El problema'],['objetivo','🎯','Objetivo'],['verifica','🔍','Verifica y compara'],['info','📚','Información'],['atencion','🎧','Atención'],['etico','⚖️','Código ético']];
const BD={ini:['🌱','Primer paso','Crea tu cuenta'],det:['🕵️','Detective','Analiza un sitio'],cmp:['⚖️','Comparador','Compara una oferta'],rep:['📢','Vigilante','Envía un reporte'],sim:['🏆','Ojo de águila','3/3 en el simulador'],fav:['⭐','Coleccionista','Guarda un favorito']};
function log(t,p,b){if(!S.user)return;S.acts.unshift({t,d:new Date().toLocaleDateString('es-MX')});S.pts+=p;if(b&&!S.badges.includes(b)){S.badges.push(b);toast('🎖️ Nueva insignia: '+BD[b][1])}save()}
const FACTS=[['💸','Si es demasiado bueno…','Descuentos de 80 % o más en productos de marca, sin fecha ni existencias claras, son una de las señales más comunes de una falsa promoción.'],['🔒','Candado no es garantía','Que una página tenga https solo indica que la conexión está cifrada. Un sitio fraudulento también puede tenerlo; revisa el nombre del dominio.'],['⚖️','Tu derecho a la información','La Ley Federal de Protección al Consumidor exige que precio, características y condiciones se informen de forma clara y veraz.'],['⏰','La prisa es una herramienta','Cronómetros, “quedan 2 piezas” y mensajes urgentes buscan que compres antes de investigar. Respira y verifica.'],['💳','Métodos de pago','Desconfía si solo aceptan transferencia directa o depósito a una cuenta personal. Los pagos con tarjeta ofrecen más vías de aclaración.'],['⭐','Reseñas falsas','Muchas reseñas idénticas, publicadas el mismo día y sin detalles reales, pueden ser manipulación de opiniones.'],['📱','Enlaces por mensaje','Bancos y tiendas serias no piden tus datos completos por mensaje ni por enlaces acortados. Entra siempre desde su sitio oficial.']];
let fi=0,ft;const TIPS=[['t1','🔗','Cómo leer un enlace','Revisa lo que está justo antes del primer “/”. Ese es el verdadero dominio.'],['t2','🧾','Guarda tus pruebas','Conserva capturas, comprobantes, conversaciones y número de pedido antes de reportar.'],['t3','🛑','Qué hacer si ya pagaste','Contacta a tu banco para aclarar el cargo, cambia contraseñas y presenta una queja ante Profeco.'],['t4','📜','Derecho a la privacidad','Puedes pedir acceso, rectificación, cancelación u oposición al uso de tus datos (derechos ARCO).']];
let vt='det',si=0,sc=0,ans=null;
const SIM=[{t:'📩 “Banco XYZ: tu cuenta será bloqueada hoy. Confirma tus datos en bit.ly/xyz-seguro”',a:1,w:'Enlace acortado, urgencia y petición de datos: clásico phishing.'},{t:'🛍️ Tienda conocida: laptop con 85 % de descuento, solo transferencia a cuenta personal, 3 piezas.',a:1,w:'Descuento extremo, escasez y pago a cuenta personal son banderas rojas.'},{t:'📦 Tu pedido #4821 de una tienda donde sí compraste salió de almacén. Rastréalo desde tu cuenta oficial.',a:0,w:'No pide datos ni dinero; remite a tu cuenta oficial. Aun así, entra tú mismo al sitio.'}];
const V={
inicio:()=>`<div class="hero"><div><h1>Compra con confianza.<br>Evita la estafa.</h1><p>Protegemos tu dinero y tus datos frente a fraudes y publicidad engañosa. Comparamos y verificamos tiendas y ofertas.</p><button class="btn" onclick="location.hash='verifica'">Verificar un sitio ahora</button></div><div class="big">🛡️</div></div>
<h2>Cómo te cuidamos</h2><div class="grid"><div class="card"><div class="ic">🚨</div><h3>El problema</h3><p class="mu">Falsas promociones, páginas fraudulentas y datos robados.</p></div><div class="card"><div class="ic">🔎</div><h3>La solución</h3><p class="mu">Comparamos y verificamos tiendas y ofertas.</p></div><div class="card"><div class="ic">💚</div><h3>El beneficio</h3><p class="mu">Ahorra dinero y compra con confianza.</p></div></div>
<h2>Herramientas estrella</h2><div class="grid">${[['🕵️','Detector de sospechas','verifica','det'],['📊','Comparador de ofertas','verifica','cmp'],['📢','Reporta una estafa','atencion',''],['🎮','¿Caerías en esta estafa?','verifica','sim']].map(x=>`<div class="card tool" onclick="${x[3]?`vt='${x[3]}';`:''}location.hash='${x[2]}'"><div class="ic">${x[0]}</div><h3>${x[1]}</h3></div>`).join('')}</div>`,
problema:()=>`<h1>⚠️ El problema</h1><p class="mu">Cada día se publican ofertas falsas, anuncios exagerados y páginas que imitan tiendas reales. Sus víctimas pierden dinero y entregan datos personales.</p>
<div class="grid"><div class="card"><div class="ic">💥</div><h3>Fraude</h3><p class="mu">Pagos por productos que nunca llegan.</p></div><div class="card"><div class="ic">🎭</div><h3>Publicidad engañosa</h3><p class="mu">Promesas falsas o exageradas.</p></div><div class="card"><div class="ic">🔓</div><h3>Datos robados</h3><p class="mu">Formularios falsos que copian tu información.</p></div></div>
<h2>💡 Saber más</h2><div class="fact" id="fact"></div><div class="dots" id="dots"></div>`,
objetivo:()=>`<h1>🎯 Nuestro objetivo</h1><div class="grid"><div class="card"><div class="ic">🧭</div><h3>Misión</h3><p class="mu">Proteger y orientar a los consumidores digitales mediante herramientas informativas que permitan identificar posibles fraudes, reconocer publicidad engañosa y ejercer sus derechos.</p></div><div class="card"><div class="ic">🔭</div><h3>Visión</h3><p class="mu">Ser plataforma de referencia en educación y prevención del fraude digital, promoviendo una cultura de consumo responsable.</p></div></div>
<h2>Valores</h2><div class="grid">${[['🤝','Honestidad'],['🔍','Transparencia'],['✅','Responsabilidad'],['🔐','Seguridad'],['💬','Respeto'],['⚖️','Equidad']].map(v=>`<div class="card" style="text-align:center"><div class="ic">${v[0]}</div><b>${v[1]}</b></div>`).join('')}</div>`,
verifica:()=>`<h1>🔍 Verifica y compara</h1><div class="tabs">${[['det','🕵️ Detector'],['cmp','📊 Comparador'],['sim','🎮 Simulador']].map(t=>`<button class="${vt==t[0]?'on':''}" onclick="vt='${t[0]}';go()">${t[1]}</button>`).join('')}</div>`+
(vt=='det'?`<div class="card"><span class="tag">Función estrella</span><h3 style="margin-top:8px">Detector de sospechas</h3><p class="mu">Escribe una dirección web y revisa sus señales de alerta. Es una guía educativa, no un veredicto.</p><input id="u" placeholder="https://oferta-increible.xyz/premio"><button class="btn" onclick="detect()">Analizar</button><div id="r"></div></div>`:
vt=='cmp'?`<div class="card"><h3>Comparador de ofertas</h3><label>Precio “original” anunciado</label><input id="p1" type="number" min="0"><label>Precio de oferta</label><input id="p2" type="number" min="0"><label>Precio en otras tiendas confiables</label><input id="p3" type="number" min="0"><button class="btn" onclick="cmp()">Comparar</button><div id="r"></div></div>`:`<div class="card" id="sim"></div>`),
info:()=>`<h1>📚 Centro de información</h1><p class="mu">Consejos y derechos del consumidor. Guarda los que quieras en tus favoritos.</p><div class="grid">${TIPS.map(t=>`<div class="card"><div class="ic">${t[1]}</div><h3>${t[2]}</h3><p class="mu">${t[3]}</p><button class="btn s" onclick="fav('art','${t[2]}')">⭐ Guardar</button></div>`).join('')}</div>`,
atencion:()=>`<h1>🎧 Atención al cliente</h1><div class="card"><h3>📢 Reporta una estafa</h3><label>Tipo</label><select id="rt"><option>Tienda falsa</option><option>Publicidad engañosa</option><option>Robo de datos</option><option>Suplantación</option><option>Otro</option></select><label>Sitio o anuncio</label><input id="rs" placeholder="Dirección o nombre"><label>¿Qué ocurrió?</label><textarea id="rd" rows="4"></textarea><button class="btn" onclick="rep()">Enviar reporte</button></div>
<h2>Preguntas frecuentes</h2><details><summary>¿Qué pasa con mi reporte?</summary><p class="mu">Se revisa, se te informa que fue recibido, se te orienta sobre instituciones de apoyo y se da seguimiento hasta el cierre.</p></details><details><summary>¿Ustedes resuelven mi caso?</summary><p class="mu">Ofrecemos orientación informativa; no sustituimos a las autoridades como Profeco.</p></details>`,
etico:()=>{const E=[['Principios','Honestidad, responsabilidad, transparencia, respeto y seguridad.'],['Conductas prohibidas','Fraudes, publicidad engañosa, robo de información, suplantación, acoso, reseñas falsas y uso ilegal de la plataforma.'],['Protección al usuario','Datos personales resguardados, información confiable, prevención, canales de denuncia, educación digital y privacidad.'],['Contra la discriminación','Sin trato injusto por género, edad, origen, religión, discapacidad, orientación, situación económica o apariencia.'],['Sanciones','Advertencia, restricción temporal, bloqueo temporal, suspensión definitiva y orientación para denunciar ante autoridades, siempre con derecho a explicar tu caso.'],['Resolución de quejas','1. Presentas la queja · 2. Revisamos · 3. Te informamos · 4. Buscamos solución · 5. Seguimiento y cierre.'],['Leyes de referencia','Ley Federal de Protección al Consumidor; Ley Federal de Protección de Datos Personales en Posesión de los Particulares; Ley Federal de Protección a la Propiedad Industrial; Ley Federal para Prevenir y Eliminar la Discriminación; Código de Comercio.']];return`<h1>⚖️ Código ético</h1><p class="mu">Consumidor Digital Responsable: comprar por internet debe ser seguro, informado y justo.</p>`+E.map((e,i)=>`<details ${i?'':'open'}><summary>${i+1}. ${e[0]}</summary><p class="mu">${e[1]}</p></details>`).join('')+`<p><b>¡Compra seguro, infórmate y haz valer tus derechos!</b></p>`},
cuenta:()=>{if(!S.user)return`<h1>👤 Mi cuenta</h1><div class="card"><p>Inicia sesión para guardar tu historial, reportes, favoritos e insignias.</p><button class="btn" onclick="modal()">Entrar o crear cuenta</button></div>`;
const lv=Math.floor(S.pts/50)+1,tab=window.ct||'perfil',T=[['perfil','🙍 Mi perfil'],['act','🕘 Mi actividad'],['rep','📋 Mis reportes'],['fav','⭐ Favoritos'],['al','🔔 Alertas'],['cfg','⚙️ Configuración']];
let b='';if(tab=='perfil')b=`<div class="card"><h3>${esc(S.user.name)}</h3><p class="mu">${S.hide?'Correo oculto':esc(S.user.email)} · Nivel ${lv} · ${S.pts} puntos</p><div class="bar"><div style="width:${S.pts%50*2}%"></div></div></div><h2>Insignias y logros</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">${Object.entries(BD).map(([k,v])=>`<div class="card badge ${S.badges.includes(k)?'':'off'}"><div class="ic">${v[0]}</div><b>${v[1]}</b><small>${v[2]}</small></div>`).join('')}</div>`;
if(tab=='act')b=S.acts.length?S.acts.map(a=>`<div class="row"><span>${esc(a.t)}</span><small class="mu">${a.d}</small></div>`).join(''):'<p class="mu">Aún no verificas nada. Prueba el Detector de sospechas.</p>';
if(tab=='rep')b=S.reps.length?S.reps.map(r=>`<div class="card" style="margin-bottom:8px"><b>${esc(r.f)} · ${esc(r.t)}</b><p class="mu">${esc(r.s)}</p><span class="tag">${r.st}</span></div>`).join(''):'<p class="mu">No has enviado reportes.</p>';
if(tab=='fav')b=S.favs.length?S.favs.map((f,i)=>`<div class="row"><span>${f.k=='art'?'📄':'🏪'} ${esc(f.t)}</span><button class="btn s" onclick="S.favs.splice(${i},1);save();go()">Quitar</button></div>`).join(''):'<p class="mu">Guarda tiendas desde el Detector y artículos desde Información.</p>';
if(tab=='al')b=S.al?['🔔 Verifica el dominio antes de pagar.','🔔 Desconfía de enlaces acortados en mensajes.','🔔 Los premios que no ganaste no existen.'].map(a=>`<div class="res warn">${a}</div>`).join(''):'<p class="mu">Alertas desactivadas en Configuración.</p>';
if(tab=='cfg')b=`<div class="card"><label>Nombre</label><input id="cn" value="${esc(S.user.name)}"><div class="row"><span>Recibir alertas de seguridad</span><input type="checkbox" style="width:auto" ${S.al?'checked':''} onchange="S.al=this.checked;save()"></div><div class="row"><span>Ocultar mi correo en el perfil</span><input type="checkbox" style="width:auto" ${S.hide?'checked':''} onchange="S.hide=this.checked;save()"></div><button class="btn" onclick="S.user.name=$('#cn').value||S.user.name;save();toast('Guardado')">Guardar cambios</button> <button class="btn s" onclick="out()">Cerrar sesión</button></div>`;
return`<h1>👤 Mi cuenta</h1><div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="ct='${t[0]}';go()">${t[1]}</button>`).join('')}</div>`+b}};
function detect(){let u=$('#u').value.trim().toLowerCase();if(!u)return;let s=[],h;try{h=new URL(/^https?:/.test(u)?u:'http://'+u).hostname}catch(e){return $('#r').innerHTML='<div class="res bad">Dirección no válida.</div>'}

V.problema=()=>`<h1>Razón de existir: El problema</h1><p class="mu">En Estafadon’t analizamos las compras digitales para proteger tu dinero, tus datos personales y tus derechos como consumidor.</p><div class="grid">
<div class="card pc"><span class="tag">Problema</span><p style="margin-top:8px">Protegemos tu dinero de la publicidad engañosa, los fraudes y las páginas que roban datos.</p><div class="ics">${I('unlock')}${I('card')}</div><span class="circ">${I('eye')}</span></div>
<div class="card pc"><span class="tag">Solución</span><p style="margin-top:8px">Te ayudamos a comparar y verificar tiendas oficiales.</p><div class="ics">${I('bag')}${I('lock')}</div><span class="tag">${I('check')} Verificado</span><span class="circ">${I('bulb')}</span></div>
<div class="card pc"><span class="tag">Beneficio</span><p style="margin-top:8px">Te ayudamos a ahorrar dinero y a comprar de forma inteligente.</p><div class="ics">${I('coin')}${I('shield')}</div><span class="circ">${I('smile')}</span></div></div>
<div class="cta"><b>Evita perder tu dinero con falsa publicidad</b><button class="btn" onclick="openInfo()">Obtén más información</button></div>
<div id="more" hidden class="grid" style="margin-top:12px">
<div class="card">${chip('alert')}<h3>Qué es la publicidad engañosa</h3><p class="mu">Es cualquier anuncio con información falsa, exagerada o confusa que te lleva a comprar. La Ley Federal de Protección al Consumidor exige que la publicidad sea veraz, comprobable y clara.</p></div>
<div class="card">${chip('eye')}<h3>Señales de alerta</h3><ul class="mu"><li>Descuentos extremos sin condiciones.</li><li>Urgencia artificial: cronómetros y pocas piezas.</li><li>Sin razón social, domicilio ni datos de contacto.</li><li>Letras pequeñas o precio que cambia al pagar.</li></ul></div>
<div class="card">${chip('scale')}<h3>Tus derechos</h3><p class="mu">Tienes derecho a información clara, al precio final antes de pagar y a que se cumpla lo ofrecido. Puedes presentar una queja ante Profeco y revisar proveedores en su Buró Comercial.</p></div>
<div class="card">${chip('shield')}<h3>Si ya te pasó</h3><ul class="mu"><li>Guarda capturas, comprobantes y conversaciones.</li><li>Avisa a tu banco para aclarar el cargo.</li><li>Cambia tus contraseñas.</li><li>Repórtalo en Atención al cliente.</li></ul></div></div>
<details style="margin-top:14px"><summary>¿Por qué existimos?</summary><p class="mu">Muchas personas compran por internet sin verificar si las páginas son confiables. Esto provoca fraudes, engaños y pérdida de dinero, y vulnera derechos como recibir información clara, completa y veraz. También puede poner en riesgo la protección de sus datos.</p></details>
<h2 id="sm">Rastrotips</h2><div class="tip" id="fact"></div><div class="dots" id="dots"></div>`;
V.objetivo=()=>`<h1>Nuestro objetivo</h1><div class="card obj">${chip('lock')}<div style="flex:1"><h3>Objetivo y ayuda</h3><p class="mu">En Estafadon’t buscamos fomentar compras seguras y responsables, ayudándote a reconocer ofertas engañosas y a conocer tus derechos como consumidor.</p><span class="tag">${I('check')} Verificado</span></div>${P('s4p2','gm')}</div><div class="grid"><div class="card">${chip('target')}<h3>Misión</h3><p class="mu">En Estafadon’t protegemos y orientamos a los consumidores digitales con herramientas informativas que permiten identificar posibles fraudes, reconocer publicidad engañosa y ejercer sus derechos.</p></div><div class="card">${chip('eye')}<h3>Visión</h3><p class="mu">Queremos ser una plataforma de referencia en educación y prevención del fraude digital, promoviendo una cultura de consumo responsable.</p></div></div>`;
const VAL=[['Honestidad','lock','En Estafadon’t decimos la verdad sobre lo que sabemos y lo que no. Si no pudimos verificar una tienda, te lo decimos tal cual.','Marcamos una oferta como dudosa aunque venga de una marca conocida.'],['Transparencia','eye','Te explicamos cómo funciona la plataforma y qué hacemos con tu información, sin letras chiquitas.','Cada resultado muestra las señales que revisamos.'],['Responsabilidad','shield','Nos hacemos cargo de lo que recomendamos y fomentamos compras seguras y sostenibles sin perjudicar a otros consumidores.','Corregimos nuestros contenidos cuando detectamos un error.'],['Integridad','bulb','Lo que decimos y lo que hacemos coinciden: nuestras recomendaciones son coherentes y no responden a intereses comerciales.','Una tienda no aparece como confiable por conveniencia, sino por cumplir.'],['Seguridad','check','Te damos herramientas para identificar riesgos antes de pagar y cuidamos tus datos personales.','Antes de comprar puedes revisar un enlace con la Lupa de Rastro.'],['Respeto','users','Mantenemos una comunicación amable y no toleramos comentarios ofensivos ni discriminatorios.','Usamos un lenguaje claro e inclusivo en toda la plataforma.'],['Equidad','scale','Todas las personas, sin importar edad, origen o situación económica, merecen información clara para comprar con confianza.','Nuestros juegos están pensados para todas las edades.']];

const COD=[['Principios','Reglas que orientan el comportamiento de usuarios y administradores para promover la honestidad, la responsabilidad, el respeto y la transparencia.',['Honestidad: proporcionar información veraz sobre productos, servicios, precios y promociones.','Responsabilidad: usar la plataforma de forma adecuada y evitar acciones que perjudiquen a otros consumidores.','Transparencia: explicar con claridad cómo funciona la aplicación y cómo se usa la información de los usuarios.','Respeto: mantener una comunicación amable, sin comentarios ofensivos ni discriminatorios.','Seguridad: ofrecer herramientas para identificar riesgos antes de comprar.']],
['Conductas prohibidas','Prohibimos cualquier conducta que ponga en riesgo la seguridad, la economía o la privacidad de los consumidores.',['Fraudes y estafas: ofertas falsas, cobros por productos inexistentes o engaño a compradores.','Publicidad engañosa: información falsa o exagerada sobre características, calidad o beneficios.','Robo de información: obtener, compartir o usar datos personales o financieros sin autorización.','Suplantación de identidad: hacerse pasar por otra persona, empresa o establecimiento.','Acoso y amenazas: intimidar, ofender o perjudicar a otros usuarios.','Manipulación de opiniones: publicar reseñas falsas para beneficiar o dañar a un negocio.','Uso indebido: emplear la plataforma para actividades ilegales o que afecten su funcionamiento.']],
['Protección al usuario','Ofrecemos información y herramientas para comprar en línea con más seguridad.',['Datos personales: evitamos la exposición innecesaria de nombres, domicilios, teléfonos y datos financieros.','Información confiable: recomendaciones para identificar páginas sospechosas y publicidad engañosa.','Prevención de fraudes: te enseñamos a detectar ofertas demasiado buenas, enlaces sospechosos y pagos inseguros.','Canales de denuncia: puedes reportar páginas, anuncios o prácticas sospechosas.','Educación digital: consejos sobre derechos del consumidor y precauciones antes de comprar.','Privacidad: explicamos qué información recopilamos, para qué la usamos y cómo ejercer tus derechos.']],
['No discriminación','Promovemos la igualdad de oportunidades y el respeto hacia todas las personas. Nadie recibirá un trato injusto por motivo de:',['Género o identidad de género','Edad','Nacionalidad u origen étnico','Religión o creencias','Discapacidad','Orientación sexual','Situación económica','Apariencia física'],'No permitimos mensajes ni conductas que promuevan el odio, la exclusión o la violencia.'],
['Sanciones','Ante un incumplimiento aplicamos medidas proporcionales a la gravedad del caso, de forma justa y permitiendo que la persona explique su situación.',['Advertencia: se notifica la conducta y la regla incumplida.','Restricción temporal: se limitan algunas funciones de la cuenta.','Bloqueo temporal: se suspende el acceso por un periodo en faltas graves o reincidencia.','Suspensión definitiva: se cancela la cuenta al comprobarse fraude, amenazas o incumplimientos graves.','Reporte a autoridades: ante posibles delitos, orientamos a la persona afectada para denunciar.']],
['Resolución de quejas','Atendemos las inconformidades con respeto, imparcialidad, confidencialidad y transparencia.',['Presentación: envías tu queja desde Atención al cliente con los datos del caso.','Revisión: analizamos la información y las pruebas.','Comunicación: confirmamos la recepción y te explicamos los siguientes pasos.','Solución: te damos orientación, recomendaciones o las instituciones a las que puedes acudir.','Seguimiento y cierre: te informamos el resultado de la revisión.'],'Ofrecemos orientación informativa; no sustituimos a las autoridades encargadas de resolver controversias comerciales.'],
['Leyes de referencia','Tomamos como referencia la legislación mexicana en materia de consumo, privacidad y entorno digital.',['Ley Federal de Protección al Consumidor: protege contra la publicidad engañosa, exige información clara y permite presentar quejas.','Ley Federal de Protección de Datos Personales en Posesión de los Particulares: regula el uso de datos personales y reconoce los derechos de acceso, rectificación, cancelación y oposición.','Ley Federal de Protección a la Propiedad Industrial: evita el uso no autorizado de marcas y la confusión entre consumidores.','Ley Federal para Prevenir y Eliminar la Discriminación: promueve el trato igualitario y el respeto a los derechos humanos.','Código de Comercio: da bases jurídicas a las operaciones realizadas por medios electrónicos.']]];

V.etico=()=>`<h1>Código ético</h1><p class="mu">Consumidor Digital Responsable: en Estafadon’t creemos que comprar por internet debe ser una experiencia segura, informada y justa.</p>${COD.map((c,i)=>`<details ${i?'':'open'}><summary>${I(CI[i])} ${i+1}. ${c[0]}</summary><p class="mu">${c[1]}</p><ul>${c[2].map(x=>`<li>${x.replace(/^([^:]{3,60}):/,'<b>$1:</b>')}</li>`).join('')}</ul>${c[3]?`<p class="mu">${c[3]}</p>`:''}</details>`).join('')}<p><b>¡Compra seguro, infórmate y haz valer tus derechos!</b></p>`;
const FAQ=[['¿Qué pasa cuando envío un reporte?','Lo recibimos, revisamos la información y las pruebas, te confirmamos la recepción con los siguientes pasos, te damos orientación o las instituciones a las que puedes acudir y damos seguimiento hasta el cierre.'],['¿Ustedes resuelven mi caso o devuelven mi dinero?','No. Ofrecemos orientación informativa y no sustituimos a Profeco, a tu banco ni a otras autoridades. Sí te explicamos qué hacer y a dónde acudir.'],['¿Qué pruebas conviene incluir?','Capturas del anuncio y de la tienda, el enlace, la fecha, el comprobante de pago, el número de pedido y las conversaciones con el vendedor.'],['¿Qué significa que un sitio salga “verificado”?','Que en nuestra revisión informativa no encontramos señales de alerta. No es una garantía absoluta: confirma siempre antes de pagar.'],['Ya pagué, ¿qué hago?','Avisa cuanto antes a tu banco para aclarar el cargo, guarda tus pruebas, cambia tus contraseñas y presenta tu queja ante Profeco. Después repórtalo aquí.'],['¿Cómo cuidan mis datos?','Usamos tu información solo para atender tu reporte y no la compartimos sin tu consentimiento, salvo requerimiento de una autoridad. Puedes pedir acceso, rectificación, cancelación u oposición.']];
